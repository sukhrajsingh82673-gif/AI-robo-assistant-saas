<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONATA — Universal AI Company Operating SaaS</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%233b82f6'/><text x='50%' y='68%' font-size='60' font-weight='800' fill='white' text-anchor='middle'>Z</text></svg>" />
</head>
<body>

  <!-- ========================================================================
       1. AUTHENTICATION PAGE (Entry Point)
       ======================================================================== -->
  <div id="authContainer">
    <!-- Rendered dynamically by app.js:renderAuth() -->
  </div>

  <!-- ========================================================================
       2. MAIN SAAS SHELL (Post-Authentication)
       ======================================================================== -->
  <div id="appShell" style="display:none;">

    <!-- Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">Z</div>
        <div class="brand-meta">
          <h1>ZONATA SaaS</h1>
          <span>Universal Robotic OS</span>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">Command & Control</div>

        <div class="nav-item active" data-nav="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </div>

        <div class="nav-item" data-nav="company">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 11h2M6 15h2M16 11h2M16 15h2M10 7h4v14h-4z"/></svg>
          <span>Company</span>
        </div>

        <div class="nav-item" data-nav="ceo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
          <span>AI CEO</span>
          <span class="nav-badge">Core</span>
        </div>

        <div class="nav-item" data-nav="tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Tools & Factory</span>
        </div>

        <div class="nav-section-title" style="margin-top:16px;">System</div>

        <div class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </div>
      </nav>

      <!-- Host Identity in Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="host-avatar">H</div>
        <div class="host-info">
          <div class="host-name" id="hostNameDisplay">Sukhraj Singh</div>
          <div class="host-role">Host / Owner Online</div>
        </div>
        <button class="header-btn" id="signOutBtn" title="Sign Out" style="padding:6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Wrapper & Header -->
    <main class="main-wrapper">
      <header class="app-header">
        <div class="header-left">
          <div class="header-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="globalSearchInput" placeholder="Search companies, AI employees, missions, tools, or settings..." />
          </div>
        </div>

        <div class="header-right">
          <!-- Theme Toggle -->
          <button class="header-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- Notifications Alert -->
          <button class="header-btn" onclick="showToast('2 pending owner approvals in Decision Room', 'warning')" title="Pending Approvals">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-dot"></span>
          </button>

          <!-- Host Status Indicator -->
          <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); background:var(--bg-surface); padding:6px 12px; border-radius:var(--radius-full); border:1px solid var(--border-color);">
            <span style="display:inline-block; width:8px; height:8px; background:var(--accent-emerald); border-radius:50%;"></span>
            <span>Host Mode: Full Authority</span>
          </div>
        </div>
      </header>

      <!-- Content Area with 5 Primary Views -->
      <div class="content-area">
        <section id="view-overview" class="view-section active"></section>
        <section id="view-company" class="view-section"></section>
        <section id="view-ceo" class="view-section"></section>
        <section id="view-tools" class="view-section"></section>
        <section id="view-settings" class="view-section"></section>
      </div>
    </main>
  </div>

  <!-- ========================================================================
       MODAL DIALOG CONTAINER
       ======================================================================== -->
  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button class="btn-close-modal" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer"></div>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
