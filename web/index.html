<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URA — Universal Company OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design_tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="app_shell.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ura_assistant.css" />
  <link rel="stylesheet" href="settings_v2.css" />
  <link rel="stylesheet" href="ura_ui.css" />
  <link rel="stylesheet" href="company_setup.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230071e3'/><text x='50%' y='68%' font-size='60' font-weight='800' fill='white' text-anchor='middle'>U</text></svg>" />
</head>
<body>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebarDrawer(false)"></div>

  <!-- ========================================================================
       1. AUTHENTICATION PAGE (Entry Point)
       ======================================================================== -->
  <div id="authContainer">
    <!-- Rendered dynamically by app.js:renderAuth() -->
  </div>

  <!-- ========================================================================
       2. MAIN SHELL (Post-Authentication)
       ======================================================================== -->
  <div id="appShell" class="ura-shell" style="display:none;">

    <!-- Floating, translucent sidebar -->
    <aside class="ura-sidebar" id="appSidebar" aria-label="Main navigation">
      <div class="ura-sidebar-top">
        <button class="ura-company-chip" id="companyChipBtn" type="button" aria-label="Switch company">
          <span class="ura-company-avatar" id="companyChipAvatar">U</span>
          <span class="ura-company-meta">
            <span class="ura-company-name" id="companyChipName">Loading…</span>
            <span class="ura-company-sub" id="companyChipSub">—</span>
          </span>
          <span class="ura-nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </button>
        <button class="ura-icon-btn ura-sidebar-close" type="button" aria-label="Close menu" onclick="URAShell.closeDrawer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Navigation Menu: Complete Company Operations & Platform Control -->
      <!-- Navigation is rendered from the URA screen registry -->
      <nav class="sidebar-nav" id="uraNav"></nav>

      <div class="ura-sidebar-footer" id="uraSidebarFooter"></div>
    </aside>

    <!-- Main column -->
    <div class="ura-main">
      <header class="ura-topbar">
        <div class="ura-topbar-left">
          <button class="ura-icon-btn" id="menuToggleBtn" type="button" aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <button class="ura-icon-btn" id="railToggleBtn" type="button" aria-label="Collapse sidebar to icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <nav class="ura-breadcrumbs" id="topbarBreadcrumbs" aria-label="Breadcrumb">
            <span class="breadcrumb-item root">Workspace</span>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-item active">Overview</span>
          </nav>
        </div>

        <div class="ura-topbar-right">
          <button class="ura-search-btn" id="uraSearchBtn" type="button" aria-label="Search pages, companies, actions and settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search or jump to…</span>
            <span class="ura-kbd">⌘K</span>
          </button>

          <select id="globalCompanySelector" class="ura-company-select" aria-label="Active company" onchange="handleGlobalCompanyContextChange(this.value)"></select>

          <button class="ura-status-pill" id="uraStatusPill" type="button" aria-label="CEO status">
            <span class="ura-status-dot"></span>
            <span id="uraStatusText">24/7 watch</span>
          </button>

          <span class="ura-clock" id="uraClock" aria-label="Company clock"></span>

          <button class="ura-icon-btn ura-bell" id="uraBellBtn" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="ura-badge" id="uraBellBadge" style="display:none;"></span>
          </button>

          <button class="ura-icon-btn" id="uraHelpBtn" type="button" aria-label="Help">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>

          <!-- URA Assistant trigger -->
          <button class="topbar-icon-btn" id="uraTopbarTrigger" onclick="window.URAAssistant && window.URAAssistant.toggle()" title="Open URA Assistant (Ctrl/Cmd+J)" aria-label="Open URA Assistant">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 15l.9 2.6L22.5 18.5l-2.6.9L19 22l-.9-2.6L15.5 18.5l2.6-.9L19 15z"/></svg>
          </button>

          <!-- Notifications & Approvals Trigger -->
          <button class="topbar-icon-btn" onclick="window.navigateTo('/approvals')" title="Approvals & Governance Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="topbar-notification-badge" id="topbarNotificationBadge" style="display:none;"></span>
          </button>

          <button class="ura-icon-btn" id="uraProfileBtn" type="button" aria-label="Your profile">
            <span class="ura-avatar" id="uraProfileAvatar">O</span>
          </button>

          <!-- Kept for the legacy session controller; the profile menu owns the visible control. -->
          <button id="signOutBtn" type="button" style="display:none;" aria-hidden="true" tabindex="-1"></button>
          <span id="hostNameDisplay" style="display:none;"></span>
          <span id="hostAvatarLetter" style="display:none;"></span>
          <span id="hostEmailDisplay" style="display:none;"></span>
        </div>
      </header>

      <main class="ura-workspace">
        <div class="ura-screen-root" id="uraScreenRoot">
          <section id="view-overview" class="view-section active"></section>
          <section id="view-coworker" class="view-section"></section>
          <section id="view-missions" class="view-section"></section>
          <section id="view-work" class="view-section"></section>
          <section id="view-schedule" class="view-section"></section>
          <section id="view-operations" class="view-section"></section>
          <section id="view-technology" class="view-section"></section>
          <section id="view-customers" class="view-section"></section>
          <section id="view-finance" class="view-section"></section>
          <section id="view-people" class="view-section"></section>
          <section id="view-records" class="view-section"></section>
          <section id="view-files" class="view-section"></section>
          <section id="view-reports" class="view-section"></section>
          <section id="view-agent-factory" class="view-section"></section>
          <section id="view-integrations" class="view-section"></section>
          <section id="view-approvals" class="view-section"></section>
          <section id="view-activity" class="view-section"></section>
          <section id="view-governance" class="view-section"></section>
          <section id="view-security" class="view-section"></section>
          <section id="view-company" class="view-section"></section>
          <section id="view-organization" class="view-section"></section>
          <section id="view-ceo" class="view-section"></section>
          <section id="view-ceo-records" class="view-section"></section>
          <section id="view-meeting" class="view-section"></section>
          <section id="view-workforce" class="view-section"></section>
          <section id="view-terminal" class="view-section"></section>
          <section id="view-tasks" class="view-section"></section>
          <section id="view-workflows" class="view-section"></section>
          <section id="view-agent-network" class="view-section"></section>
          <section id="view-mcp-network" class="view-section"></section>
          <section id="view-openhands-execution" class="view-section"></section>
          <section id="view-browser-execution" class="view-section"></section>
          <section id="view-temporal-durable" class="view-section"></section>
          <section id="view-nango-integrations" class="view-section"></section>
          <section id="view-processes" class="view-section"></section>
          <section id="view-trustgraph" class="view-section"></section>
          <section id="view-tools" class="view-section"></section>
          <section id="view-plugins" class="view-section"></section>
          <section id="view-settings" class="view-section"></section>
          <section id="view-artifacts" class="view-section"></section>
          <section id="view-design" class="view-section"></section>
          <section id="view-404" class="view-section"></section>
        </div>
      </main>
    </div>
  </div>

  <!-- ========================================================================
       MODAL DIALOG CONTAINER
       ======================================================================== -->
  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Modal Title</h3>
        <button class="btn-close-modal" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" role="status" aria-live="polite"></div>

  <!-- URA Assistant is the only assistant surface (launcher + window) -->
  <div id="uraAssistantRoot"></div>

  <!-- Mobile Bottom Navigation Bar (Responsive Handheld UX) -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-btn active" onclick="switchNav('overview')" title="Home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Home</span>
    </button>
    <button class="mobile-nav-btn" onclick="switchNav('missions')" title="Work & Missions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Work</span>
    </button>
    <button class="mobile-nav-btn mobile-assistant-btn" id="mobileAssistantTab" onclick="window.URAAssistant && window.URAAssistant.toggleSheet()" title="URA Assistant" aria-label="Open URA Assistant">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 15l.9 2.6L22.5 18.5l-2.6.9L19 22l-.9-2.6L15.5 18.5l2.6-.9L19 15z"/></svg>
      <span>Assistant</span>
    </button>
    <button class="mobile-nav-btn" onclick="switchNav('records')" title="Enterprise Records">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Records</span>
    </button>
    <button class="mobile-nav-btn" onclick="toggleSidebarDrawer(true)" title="Navigation Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Menu</span>
    </button>
  </nav>

  <!-- URA mobile tab bar (rendered by ura_shell.js) -->
  <nav class="ura-tabbar" id="uraTabbar"></nav>

  <!-- Reconstructed Subsystem Scripts -->
  <script src="i18n.js"></script>
  <script src="company_context.js"></script>
  <script src="company_workspace.js"></script>
  <script src="ai_ceo_workspace.js"></script>
  <script src="meeting_room_workspace.js"></script>
  <script src="org_workspace.js"></script>
  <script src="workforce_workspace.js"></script>
  <script src="taskmaker_workspace.js"></script>
  <script src="processes_workspace.js"></script>
  <script src="trustgraph_workspace.js"></script>
  <script src="settings_enterprise.js"></script>
  <script src="settings_v2.js"></script>
  <script src="tools_factory.js"></script>
  <script src="schedule_workspace.js"></script>
  <script src="plugins_workspace.js"></script>
  <script src="ura_assistant.js"></script>
  <script src="overview_workspace.js"></script>
  <script src="workflow_workspace.js"></script>
  <script src="agent_network_workspace.js"></script>
  <script src="mcp_workspace.js"></script>
  <script src="openhands_workspace.js"></script>
  <script src="browser_workspace.js"></script>
  <script src="temporal_workspace.js"></script>
  <script src="nango_workspace.js"></script>
  <script src="assistant_coworker_workspace.js"></script>
  <!-- New Enterprise Operating Workspaces -->
  <script src="records_workspace.js"></script>
  <script src="files_workspace.js"></script>
  <script src="reports_workspace.js"></script>
  <script src="agent_factory_workspace.js"></script>
  <script src="finance_workspace.js"></script>
  <script src="integrations_workspace.js"></script>
  <script src="operations_workspace.js"></script>
  <script src="crm_sales_workspace.js"></script>
  <script src="people_workspace.js"></script>
  <script src="governance_workspace.js"></script>
  <!-- Apple-Grade Design System Foundations -->
  <script src="motion.js"></script>
  <script src="icons.js"></script>
  <script src="app_tile.js"></script>
  <script src="ai_orb.js"></script>
  <script src="components.js"></script>
  <script src="ai_action_card.js"></script>
  <script src="ceo_command_center.js"></script>
  <script src="department_workspace.js"></script>
  <script src="apple_workforce_board.js"></script>
  <script src="apple_sales_board.js"></script>
  <script src="apple_reports_preview.js"></script>
  <script src="apple_governed_terminal.js"></script>
  <script src="apple_security_center.js"></script>
  <script src="apple_coworker_assistant.js"></script>
  <script src="app_shell.js"></script>
  <script src="entry_flows.js"></script>
  <script src="design_preview_workspace.js"></script>
  <!-- Company setup: switcher + Add page (before the app router) -->
  <script src="company_setup_switcher.js"></script>
  <script src="company_setup_add.js"></script>
  <script src="company_setup_create.js"></script>
  <script src="company_setup_existing.js"></script>
  <script src="company_setup_progress.js"></script>
  <script src="company_setup_overview.js"></script>
  <script src="company_setup_edit.js"></script>
  <script src="company_setup_delete.js"></script>
  <!-- Application Script -->
  <script src="app.js"></script>
  <!-- URA UI layer: core, settings, screens, shell -->
  <script src="ura_core.js"></script>
  <script src="ura_settings.js"></script>
  <script src="ura_screens.js"></script>
  <script src="ura_shell.js"></script>
</body>
</html>
