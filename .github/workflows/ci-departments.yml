name: Step 7 Department Depth CI

on:
  push:
    branches:
      - step7-departments
      - "step7-*"
  pull_request:
    branches:
      - step7-departments
      - main

concurrency:
  group: step7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-departments:
    name: Department Depth Unit & Contract Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zonata
          POSTGRES_PASSWORD: zonata_test_password
          POSTGRES_DB: zonata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx pyyaml pydantic sqlalchemy psycopg2-binary cryptography

      - name: Run Step 7 Preflight & Inventory Tests
        env:
          ZONATA_TEST_MODE: "1"
          APP_ENV: "test"
          DATABASE_URL: "postgresql://zonata:zonata_test_password@localhost:5432/zonata_test"
        run: |
          pytest -v tests/test_step7_preflight.py

      - name: Run Existing Regression Tests (Steps 1 to 6)
        env:
          ZONATA_TEST_MODE: "1"
          APP_ENV: "test"
        run: |
          pytest -q tests/test_step6_*.py tests/test_step5_preflight.py
