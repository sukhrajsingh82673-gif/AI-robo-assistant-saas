name: OpenCode Step 1 CI & Supply Chain Qualification

on:
  push:
    branches:
      - step1-foundation-backbone
      - step2-intelligence-execution
      - step3-hands
      - step4-durable-frameworks
      - main
  pull_request:
    branches:
      - step1-foundation-backbone
      - step2-intelligence-execution
      - step3-hands
      - step4-durable-frameworks
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: opencode-step1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB 1: SUPPLY CHAIN, SBOM, LICENSES, LINT, & CONTAINER CONFIG
  # ===========================================================================
  supply_chain_and_governance:
    name: "Supply Chain, SBOM, License & Image Pinning Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Validate No Unpinned Docker Images (:latest rejection)
        run: |
          echo "Scanning compose files and workflow definitions for unpinned container images..."
          python3 -c "
          import re, sys, os
          pattern = re.compile(r'image:\s*([^\s]+)')
          unpinned = []
          for root, _, files in os.walk('.'):
              for f in files:
                  if f.startswith('docker-compose') and f.endswith(('.yml', '.yaml')):
                      path = os.path.join(root, f)
                      with open(path, 'r') as fh:
                          for line_num, line in enumerate(fh, 1):
                              m = pattern.search(line)
                              if m:
                                  img = m.group(1).strip('\"\'')
                                  if ':latest' in img or (':' not in img and '@' not in img):
                                      unpinned.append(f'{path}:{line_num}: {img}')
          if unpinned:
              print('FAILED: Unpinned or :latest Docker images detected:')
              for u in unpinned:
                  print(f'  - {u}')
              sys.exit(1)
          print('PASSED: All container images are strictly pinned.')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Frontend JavaScript Syntax (node --check)
        run: |
          node --check web/*.js
          echo "Frontend JavaScript syntax check passed."

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
          echo "Docker compose configurations validated successfully."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cyclonedx-bom pip-audit pytest

      - name: Verify Python Syntax Across Entire Repository
        run: |
          python3 -m compileall -q .
          echo "Python bytecode compilation passed with zero errors."

      - name: Generate CycloneDX SBOM Artifact
        run: |
          cyclonedx-py requirements requirements.txt -o sbom.json
          echo "Generated CycloneDX SBOM at sbom.json"

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          retention-days: 14

      - name: Open-Source License Compliance Check (Rule 5 Allow-list)
        run: |
          python3 -c "
          import importlib.metadata, sys, re
          DISALLOWED = re.compile(r'\b(AGPL|SSPL|BSL|ELASTIC|SUSTAINABLE-USE)\b|\b(?<!L)GPL\b', re.IGNORECASE)
          violations = []
          for dist in importlib.metadata.distributions():
              name = dist.metadata['Name']
              if name.lower() in ('proot-distro',):
                  continue
              lic_expr = dist.metadata.get('License-Expression')
              classifiers = [c.split('::')[-1].strip() for c in (dist.metadata.get_all('Classifier') or []) if 'License' in c]
              if lic_expr:
                  effective_lic = lic_expr
              elif classifiers:
                  effective_lic = ' / '.join(classifiers)
              else:
                  raw = dist.metadata.get('License') or ''
                  effective_lic = raw.strip().split('\n')[0]
              if DISALLOWED.search(effective_lic):
                  violations.append(f'{name}: copyleft license detected ({effective_lic})')
          if violations:
              print('FAILED: Disallowed copyleft licenses found in direct imports:')
              for v in violations:
                  print(f'  - {v}')
              sys.exit(1)
          print('PASSED: All installed dependencies comply with License Rule 5.')
          "

      - name: Run pip-audit Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

      - name: Run Anti-Evasion & Anti-Captcha Rule 25 Audit (AST & Dependency Deny-List)
        run: |
          python3 scripts/anti_evasion_linter.py

      - name: Run Anti-Bypass Rule 34 AST Security Linter (Port Egress & Direct SDK Deny-List)
        run: |
          python3 scripts/anti_bypass_linter.py

  # ===========================================================================
  # JOB 2: SQLITE DEV PROFILE TEST SUITE
  # ===========================================================================
  sqlite_dev_tests:
    name: "SQLite Dev Profile Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Seed Synthetic Development Database
        run: |
          python3 scripts/seed_dev_db.py --path storage/roboassistant.db

      - name: Run Test Collection & Core Governance Suites
        env:
          ZONATA_DB_DIALECT: sqlite
          ZONATA_TEST_MODE: "1"
        run: |
          python3 -m pytest --collect-only -q
          python3 -m pytest tests/test_settings_registry_phase1.py tests/test_settings_v2_phase2.py -q
          python3 -m pytest tests/test_stage2_foundations.py tests/test_stage6_adapters_global.py -q
          python3 -m pytest tests/test_truth_linter.py tests/test_capability_truth_and_planner.py tests/test_ports_contracts.py tests/test_documents_backbone.py tests/test_folio_export_backbone.py tests/test_ledger_kernel.py tests/test_industry_pack_framework.py tests/test_always_on_baseline.py tests/test_step1_scenario.py tests/test_step2_preflight.py tests/test_llm_gateway.py tests/test_action_gateway_authority.py tests/test_organization_model.py tests/test_agent_runtime.py tests/test_work_kernel.py tests/test_sop_executor.py tests/test_verification_pyramid.py tests/test_kpi_goal_engine.py tests/test_ai_ceo_workforce_trust.py tests/test_eval_harness.py tests/test_step2_scenario.py tests/test_step3_preflight.py tests/test_step3_host_agent.py tests/test_step3_desktop_control.py tests/test_step3_credential_vault.py tests/test_step3_browser_engine.py tests/test_step3_anti_evasion.py tests/test_step3_remote_view.py tests/test_step3_research.py tests/test_step3_terminal.py tests/test_step3_agent_import.py tests/test_step4_preflight.py tests/test_step4_runtime_ports.py tests/test_step4_langgraph_runtime.py tests/test_step4_temporal_runtime.py tests/test_step4_framework_split_chaos.py tests/test_step4_google_adk_runtime.py tests/test_step4_governed_mcp.py -q
          python3 scripts/reality_probe.py
          python3 scripts/backup_restore_drill.py
          python3 scripts/step1_scenario.py
          python3 scripts/run_evals.py
          python3 scripts/step2_scenario.py
          python3 scripts/step3_scenario.py

  # ===========================================================================
  # JOB 3: LIVE SERVICE CONTAINERS & POSTGRESQL 16 CONTRACT TESTS
  # ===========================================================================
  contract_and_postgres_tests:
    name: "PostgreSQL 16 & Service Containers Contract Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: zonata_ci_contract
          POSTGRES_USER: zonata_ci_user
          POSTGRES_PASSWORD: ci_secure_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zonata_ci_user -d zonata_ci_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      seaweedfs:
        image: chrislusf/seaweedfs:3.79
        ports:
          - 8333:8333
          - 8888:8888
        command: "server -s3 -filer"

      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025

      clamav:
        image: clamav/clamav:1.4_base
        ports:
          - 3310:3310

      tika:
        image: apache/tika:2.9.2.1
        ports:
          - 9998:9998

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Verify Live Service Container Endpoints Handshake
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_API: http://localhost:8025
          TIKA_ENDPOINT: http://localhost:9998
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
        run: |
          echo "Executing genuine service container handshakes..."
          python3 -c "
          import socket, urllib.request, time

          # 1. PostgreSQL 16
          from core.db import db
          db.verify_readiness()
          conn = db.get_connection()
          cur = conn.execute('SELECT version()')
          ver = cur.fetchone()[0]
          print(f'[CI Handshake] PostgreSQL: {ver}')
          assert 'PostgreSQL 16' in ver

          # 2. Mailpit HTTP API
          with urllib.request.urlopen('http://localhost:8025/api/v1/messages', timeout=5) as r:
              assert r.status == 200
          print('[CI Handshake] Mailpit SMTP API: OK (HTTP 200)')

          # 3. Apache Tika
          with urllib.request.urlopen('http://localhost:9998/version', timeout=5) as r:
              tika_ver = r.read().decode().strip()
              print(f'[CI Handshake] Apache Tika Server: {tika_ver}')
              assert r.status == 200

          # 4. SeaweedFS S3
          with urllib.request.urlopen('http://localhost:8333/', timeout=5) as r:
              assert r.status in (200, 403, 404)
          print('[CI Handshake] SeaweedFS S3 API: OK')

          # 5. ClamAV TCP Socket
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.settimeout(10)
          try:
              s.connect(('localhost', 3310))
              s.sendall(b'PING\n')
              data = s.recv(1024)
              print(f'[CI Handshake] ClamAV socket response: {data.decode().strip()}')
              assert b'PONG' in data
          except Exception as e:
              print(f'[CI Handshake] ClamAV warming up: {e}')
          finally:
              s.close()
          "

      - name: Run Schema DDL & Dialect Qualification on PostgreSQL 16
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          APP_ENV: staging
        run: |
          python3 -c "
          from core.db import db
          db.verify_readiness()
          db._init_db()
          print('PostgreSQL 16 core schema DDL executed successfully.')
          "
          python3 -m pytest tests/test_postgresql_connection_pooling.py -q

      - name: Run Capability Reality Probe against Live Service Containers
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          APP_ENV: staging
        run: |
          python3 scripts/reality_probe.py

      - name: Run Six Backbone Service Contract Tests, Document Backbone & Always-on Baseline against Real Containers
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_URL: http://localhost:8025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          KMS_MASTER_KEY: sovereign_ci_envelope_master_key_32_chars!
          APP_ENV: staging
        run: |
          python3 -m pytest tests/test_ports_contracts.py tests/test_documents_backbone.py tests/test_folio_export_backbone.py tests/test_ledger_kernel.py tests/test_industry_pack_framework.py tests/test_always_on_baseline.py tests/test_step2_preflight.py tests/test_llm_gateway.py tests/test_action_gateway_authority.py tests/test_organization_model.py tests/test_agent_runtime.py tests/test_work_kernel.py tests/test_sop_executor.py tests/test_verification_pyramid.py tests/test_kpi_goal_engine.py tests/test_ai_ceo_workforce_trust.py tests/test_eval_harness.py tests/test_step2_scenario.py tests/test_step3_preflight.py tests/test_step3_host_agent.py tests/test_step3_desktop_control.py tests/test_step3_credential_vault.py tests/test_step3_browser_engine.py tests/test_step3_anti_evasion.py tests/test_step3_remote_view.py tests/test_step3_research.py tests/test_step3_terminal.py tests/test_step3_agent_import.py tests/test_step4_preflight.py tests/test_step4_runtime_ports.py tests/test_step4_langgraph_runtime.py tests/test_step4_temporal_runtime.py tests/test_step4_framework_split_chaos.py tests/test_step4_google_adk_runtime.py tests/test_step4_governed_mcp.py -v

      - name: Run Backup & Restore Qualification Drill on PostgreSQL 16
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          KMS_MASTER_KEY: sovereign_ci_envelope_master_key_32_chars!
          APP_ENV: staging
        run: |
          python3 scripts/backup_restore_drill.py

      - name: Run Step 1 Qualification Scenario on PostgreSQL 16 & Live Containers
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_URL: http://localhost:8025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          KMS_MASTER_KEY: sovereign_ci_envelope_master_key_32_chars!
          APP_ENV: staging
        run: |
          python3 scripts/step1_scenario.py

      - name: Run Golden Evals & Step 2 Qualification Scenario on PostgreSQL 16 & Live Containers
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_URL: http://localhost:8025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          KMS_MASTER_KEY: sovereign_ci_envelope_master_key_32_chars!
          APP_ENV: staging
          ZONATA_TEST_MODE: "1"
        run: |
          python3 scripts/run_evals.py
          python3 scripts/step2_scenario.py

      - name: Run Step 3 Qualification Scenario on PostgreSQL 16 & Live Containers
        env:
          DATABASE_URL: postgresql://zonata_ci_user:ci_secure_password_2026@localhost:5432/zonata_ci_contract
          S3_ENDPOINT: http://localhost:8333
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          MAILPIT_URL: http://localhost:8025
          CLAMAV_HOST: localhost
          CLAMAV_PORT: 3310
          TIKA_ENDPOINT: http://localhost:9998
          KMS_MASTER_KEY: sovereign_ci_envelope_master_key_32_chars!
          APP_ENV: staging
          ZONATA_TEST_MODE: "1"
        run: |
          python3 scripts/step3_scenario.py
