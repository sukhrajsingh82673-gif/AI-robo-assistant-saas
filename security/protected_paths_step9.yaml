# ZONATA Security: Protected Paths Policy (Rule 77 Preservation Extension)
# Steps 1 to 8 are frozen under signed tag `step8-final` (commit 7aee993).
# Step 9 is strictly additive. Any modification, deletion, or renaming of protected paths is a hard violation.

