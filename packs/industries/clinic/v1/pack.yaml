schema_version: "zonata.industry-pack/v1"
metadata:
  pack_id: "clinic_health"
  name: "Outpatient Healthcare Clinic & Practice"
  version: "1.0.0"
  description: "Outpatient healthcare clinic operating pack for patient consultation, treatment records, medical supplies, and statutory compliance"
  author: "ZONATA Healthcare Systems"
  industry_code: "Q86"  # Human health activities

document_templates:
  - template_id: "tpl_clinic_intake"
    name: "Patient Medical Intake & Informed Consent"
    type: "patient_consent"
    default_sensitivity: "RESTRICTED"
    default_retention_days: 2555
    schema:
      patient_id: "string"
      emergency_contact: "string"
      hipaa_acknowledged: "boolean"
  - template_id: "tpl_clinic_treatment_summary"
    name: "Physician Clinical Treatment Summary"
    type: "treatment_summary"
    default_sensitivity: "RESTRICTED"
    default_retention_days: 2555
    schema:
      diagnosis_code_icd10: "string"
      attending_physician: "string"

chart_of_accounts:
  - code: "1010"
    name: "Clinic Operating Account"
    type: "ASSET"
    currency: "USD"
  - code: "1200"
    name: "Patient & Insurance Receivables"
    type: "ASSET"
    currency: "USD"
  - code: "2010"
    name: "Medical Supply Accounts Payable"
    type: "LIABILITY"
    currency: "USD"
  - code: "3010"
    name: "Practice Capital & Equity"
    type: "EQUITY"
    currency: "USD"
  - code: "4010"
    name: "Patient Consultation & Clinical Fee Revenue"
    type: "REVENUE"
    currency: "USD"
  - code: "5010"
    name: "Medical & Surgical Supplies Expense"
    type: "EXPENSE"
    currency: "USD"
  - code: "5020"
    name: "Clinic Staff & Nursing Salaries"
    type: "EXPENSE"
    currency: "USD"

folio_types:
  - folio_type: "patient_engagement"
    name: "Patient Clinical Dossier & Treatment Folio"
    description: "Governs patient clinical intake, diagnostic reports, and medical consultations"
    required_documents: ["tpl_clinic_intake"]
    optional_documents: ["tpl_clinic_treatment_summary"]
    required_tasks: ["verify_insurance", "physician_intake", "post_treatment_review"]

workflows:
  - workflow_id: "wf_patient_consultation_billing"
    name: "Patient Consultation Fee Billing & Accounting"
    triggers: ["consultation_completed", "discharge"]
    steps:
      - step_id: "record_consultation"
        action: "generate_treatment_summary"
      - step_id: "post_fee"
        action: "post_journal_entry"
        debit_account: "1200"
        credit_account: "4010"

compliance_rules:
  - rule_id: "cmp_hipaa_phi_audit"
    name: "Annual HIPAA PHI Privacy & Access Log Audit"
    frequency_days: 365
    required_approvers: ["compliance_officer", "medical_director"]
