pack: support_to_resolution
version: "1.0.0"
name: "Support-to-Resolution Enterprise Engine"
description: "AI-driven customer support engineering covering ticket intake, sentiment triage, diagnostic lookup, fix generation, and CSAT feedback."
owner_role: "COO/CTO"
trigger_events:
  - "support.ticket_opened"
  - "chat.escalation_requested"
  - "monitoring.customer_incident"

SIPOC:
  suppliers:
    - "Customer Support Portal"
    - "System Monitoring Alarms"
    - "Executive Escalation Inboxes"
  inputs:
    - "ticket_id"
    - "customer_id"
    - "subject"
    - "description"
    - "severity"
  process_steps:
    - "ticket_triage"
    - "knowledge_retrieval"
    - "resolution_generation"
    - "qa_verification"
    - "customer_dispatch"
    - "feedback_collection"
  outputs:
    - "triage_classification"
    - "knowledge_article_refs"
    - "resolution_message"
    - "ticket_resolution_status"
    - "csat_score"
  customers:
    - "End-User Client"
    - "Customer Success Team"
    - "Product Engineering"

steps:
  - id: "ticket_triage"
    name: "Intent, Sentiment & Priority Classification"
    actor: "agent"
    role: "COO"
    tool_capabilities:
      - "nlp.classify_intent"
      - "nlp.detect_sentiment"
    gate_checks:
      - "CharterGate"
    reversible: true

  - id: "knowledge_retrieval"
    name: "Verified Knowledge Base & Diagnostic Extraction"
    actor: "agent"
    role: "CTO"
    tool_capabilities:
      - "rag.query_knowledge_base"
      - "logs.query_diagnostics"
    gate_checks:
      - "CharterGate"
    reversible: true

  - id: "resolution_generation"
    name: "Solution Synthesis and Root-Cause Mapping"
    actor: "agent"
    role: "CTO"
    tool_capabilities:
      - "llm.synthesize_resolution"
    gate_checks:
      - "CharterGate"
      - "BudgetGate"
    reversible: true

  - id: "qa_verification"
    name: "Safety & Accuracy Deterministic Verification"
    actor: "agent"
    role: "CLO"
    tool_capabilities:
      - "qa.verify_hallucination"
      - "compliance.pii_redaction"
    gate_checks:
      - "CharterGate"
    reversible: true

  - id: "customer_dispatch"
    name: "Resolution Delivery and Notification"
    actor: "system"
    role: "COO"
    tool_capabilities:
      - "email.send_customer_response"
      - "portal.update_ticket"
    gate_checks:
      - "KillSwitchGate"
    reversible: true

  - id: "feedback_collection"
    name: "CSAT Survey and Continuous Improvement Feed"
    actor: "system"
    role: "COO"
    tool_capabilities:
      - "survey.record_csat"
      - "kaizen.record_metric"
    gate_checks:
      - "CharterGate"
    reversible: true

policies:
  max_initial_response_minutes: 15
  sla_p0_minutes: 30
  sla_p1_minutes: 120
  csat_target_minimum: 4.5

KPIs:
  target_cycle_time_seconds: 1800.0
  target_first_pass_yield: 0.94
  target_cost_per_unit_usd: 1.50
  target_error_rate: 0.01
  target_customer_satisfaction: 4.85

waste_tags:
  - "waiting"
  - "rework"
  - "handoff"
  - "defects"

andon:
  - condition_id: "ANDON-S2R-01"
    rule_name: "p0_security_breach_detected"
    trigger_expression: "severity == 'P0' and is_security_incident == True"
    action: "HALT_AND_ESCALATE"
    escalate_to_role: "CISO"
    description: "Emergency halt and escalation to CISO when customer reports unauthorized breach or exploit."

  - condition_id: "ANDON-S2R-02"
    rule_name: "legal_threat_escalation"
    trigger_expression: "is_legal_threat == True"
    action: "HALT_AND_ESCALATE"
    escalate_to_role: "CLO"
    description: "Halt automated replies and escalate to Legal Counsel when litigation is threatened."

autonomy:
  current_level: 2
  promotion_criteria:
    min_completed_runs: 100
    min_first_pass_yield: 0.95
    min_csat_average: 4.7
  demotion_criteria:
    csat_average_below: 4.0
    sla_breach_count: 3

simulation_scenarios:
  - scenario_id: "SIM-S2R-API-RATE-LIMIT"
    name: "API 429 Rate Limit Resolution"
    description: "Customer receives 429 errors; system identifies burst traffic and provides token bucket configuration."
    initial_inputs:
      ticket_id: "TCK-88102"
      customer_id: "cust_apex_tech"
      subject: "Seeing HTTP 429 Rate Limit Errors"
      description: "Our nightly batch job is failing with 429 Too Many Requests."
      severity: "P2"
      is_security_incident: False
      is_legal_threat: False
    expected_outputs:
      ticket_triage_output: "processed"
      customer_dispatch_output: "processed"
    expected_status: "COMPLETED"

  - scenario_id: "SIM-S2R-ANDON-SECURITY"
    name: "Andon Security Incident Escalation"
    description: "Stops automated replies and triggers immediate CISO escalation on critical breach report."
    initial_inputs:
      ticket_id: "TCK-99999"
      customer_id: "cust_bank_corp"
      subject: "Potential Data Exposure Detected"
      description: "We found unauthenticated database endpoints in our log audit."
      severity: "P0"
      is_security_incident: True
      is_legal_threat: False
    expected_outputs: {}
    expected_status: "HALTED_ANDON"
