version: '3.8'

services:
  zonata-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - DB_PATH=/app/storage/roboassistant.db
    volumes:
      - .:/app
    command: ["python3", "api_server.py", "8080"]
