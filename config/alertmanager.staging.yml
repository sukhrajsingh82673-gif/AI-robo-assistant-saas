# ==============================================================================
# ZONATA UNIVERSAL AI COMPANY OPERATING SYSTEM
# Alertmanager Configuration — Cloud Staging & External Notification Dispatcher
# Supports Slack, PagerDuty, and Internal Telemetry Webhook
# ==============================================================================

global:
  resolve_timeout: 5m
  # Slack API URL (populated via environment variable or secret replacement)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity', 'tier']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'default-operations-receiver'
  routes:
    # Critical P0 alerts route directly to on-call pager
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    # High severity warnings route to Slack channel
    - match:
        severity: warning
      receiver: 'slack-ops-channel'
      continue: true

receivers:
  # 1. Default Internal Operations Webhook (ZONATA Control Plane Telemetry)
  - name: 'default-operations-receiver'
    webhook_configs:
      - url: 'http://zonata-api:8080/api/telemetry/alerts/webhook'
        send_resolved: true

  # 2. PagerDuty Receiver for Critical SRE Outages (P0)
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY}'
        send_resolved: true
        severity: 'critical'
        description: '{{ .CommonAnnotations.description }}'
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          tier: '{{ .CommonLabels.tier }}'
          environment: 'staging'

  # 3. Slack Receiver for SRE Warnings & Operational Notifications
  - name: 'slack-ops-channel'
    slack_configs:
      - channel: '#zonata-sre-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.tier }})'
        text: '{{ .CommonAnnotations.summary }}\n{{ .CommonAnnotations.description }}'
