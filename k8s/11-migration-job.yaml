apiVersion: batch/v1
kind: Job
metadata:
  name: zonata-schema-migration
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: zonata-migration
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zonata-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migration-runner
          image: zonata/migration:v3.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: zonata-config
            - secretRef:
                name: zonata-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
