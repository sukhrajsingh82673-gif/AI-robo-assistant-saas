apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zonata-edge-gateway
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: zonata-edge-gateway
    app.kubernetes.io/part-of: zonata-operating-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecRule REQUEST_HEADERS:User-Agent "^$" "id:1001,phase:1,deny,status:403,msg:'Empty User-Agent Blocked'"
      SecRule REQUEST_URI "@contains /v1/sys/" "id:1002,phase:1,deny,status:403,msg:'Restricted Internal Vault Path Blocked'"
      SecRule REQUEST_URI "@contains /temporal/" "id:1003,phase:1,deny,status:403,msg:'Restricted Internal Temporal Path Blocked'"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - api.zonata.ai
        - console.zonata.ai
      secretName: zonata-tls-cert
  rules:
    - host: api.zonata.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zonata-api
                port:
                  number: 8080
    - host: console.zonata.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zonata-api
                port:
                  number: 8080
