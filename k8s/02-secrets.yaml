apiVersion: v1
kind: Secret
metadata:
  name: zonata-secrets
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: zonata
type: Opaque
stringData:
  # Base-64 or external vault injected secrets
  ZONATA_AUTH_SECRET: "zonata_prod_enterprise_cluster_master_token_64chars_minimum_entropy"
  DATABASE_URL: "postgresql://zonata_app:StrongVaultPassword123@zonata-pg-cluster.internal:5432/zonata_production?sslmode=verify-full"
  REDIS_URL: "rediss://:ClusterRedisToken@zonata-redis-cluster.internal:6379/0"
  TEMPORAL_HOST: "zonata-temporal-frontend.internal:7233"
  NANGO_SECRET_KEY: "prod_nango_live_key_vault_injected"
  S3_BUCKET: "zonata-production-evidence-storage"
  AWS_ACCESS_KEY_ID: "AKIA_PROD_VAULT_KEY"
  AWS_SECRET_ACCESS_KEY: "PROD_VAULT_SECRET_KEY"
