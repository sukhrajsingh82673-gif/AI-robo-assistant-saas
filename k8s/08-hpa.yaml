apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zonata-api-hpa
  namespace: zonata-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zonata-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zonata-worker-hpa
  namespace: zonata-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zonata-worker
  minReplicas: 4
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
