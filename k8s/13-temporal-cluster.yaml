apiVersion: apps/v1
kind: Deployment
metadata:
  name: zonata-temporal
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/part-of: zonata-operating-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/part-of: zonata-operating-system
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: temporal-server
          image: temporalio/auto-setup:1.24.0
          ports:
            - containerPort: 7233
              name: rpc
          env:
            - name: DB
              value: "postgresql"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: zonata-secrets
                  key: DB_USER
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: zonata-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_SEEDS
              value: "postgres.zonata-data.svc.cluster.local"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - port: 7233
      name: rpc
      targetPort: 7233
