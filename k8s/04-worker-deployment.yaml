apiVersion: apps/v1
kind: Deployment
metadata:
  name: zonata-worker
  namespace: zonata-system
  labels:
    app.kubernetes.io/name: zonata-worker
    app.kubernetes.io/component: async-execution
spec:
  replicas: 4
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zonata-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zonata-worker
        app.kubernetes.io/component: async-execution
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: zonata-worker
          image: zonata/worker:v3.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: zonata-config
            - secretRef:
                name: zonata-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
