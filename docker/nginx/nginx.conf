# ==============================================================================
# ZONATA UNIVERSAL AI COMPANY OPERATING SYSTEM — PRODUCTION TLS INGRESS
# Nginx Hardened Reverse Proxy Configuration
# Enforces BLK-02 / CTL-C05: Strict HTTPS, Modern TLS Ciphers, HSTS & Anti-Spoofing
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with upstream timing and client IP resolution
    log_format zonata_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log zonata_json;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Security buffers & upload limits
    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Upstream definition for Control Plane API
    upstream zonata_api_backend {
        server zonata-api:8080;
        keepalive 32;
    }

    # 1. Plain HTTP Redirect Server (Port 80 -> HTTPS 443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health probe exception for container cluster liveness
        location = /healthz {
            access_log off;
            return 200 "OK\n";
        }

        # Unconditional HTTPS Upgrade (301 Moved Permanently)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Hardened HTTPS Server (Port 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates (Mounted from volume or Secret Manager)
        ssl_certificate /etc/ssl/certs/zonata_prod.crt;
        ssl_certificate_key /etc/ssl/private/zonata_prod.key;

        # TLS Protocol Hardening (Only TLS 1.2 and TLS 1.3 permitted)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # TLS Session Cache & Tickets
        ssl_session_cache shared:ZONATA_SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (Defense in Depth)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Reverse Proxy Routing to zonata-api
        location / {
            proxy_pass http://zonata_api_backend;
            proxy_http_version 1.1;

            # WebSocket and SSE connection headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Forwarded headers with verified HTTPS scheme
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }

    # Connection upgrade mapping for WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
