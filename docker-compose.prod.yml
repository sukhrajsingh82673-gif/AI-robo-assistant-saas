version: '3.8'

services:
  zonata-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: zonata/api:1.0.0-GA
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - ENVIRONMENT=production
      - ZONATA_STRICT_AUTH=1
      - ZONATA_DISABLE_DEMO_SEED=1
      - ZONATA_CLEAN_STARTUP=1
      - DATABASE_URL=postgresql://zonata_admin:zonata_secure_prod_password_2026@postgres:5432/zonata_production
      - DB_PATH=/app/storage/roboassistant.db
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - VAULT_ADDR=http://vault:8200
      - KEYCLOAK_URL=http://keycloak:8080
      - S3_ENDPOINT=http://minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - zonata-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
      minio:
        condition: service_started

  zonata-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: zonata/worker:1.0.0-GA
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - ZONATA_STRICT_AUTH=1
      - ZONATA_DISABLE_DEMO_SEED=1
      - DATABASE_URL=postgresql://zonata_admin:zonata_secure_prod_password_2026@postgres:5432/zonata_production
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - DB_PATH=/app/storage/roboassistant.db
    volumes:
      - zonata-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
      zonata-api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=zonata_admin
      - POSTGRES_PASSWORD=zonata_secure_prod_password_2026
      - POSTGRES_DB=zonata_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonata_admin -d zonata_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data/jetstream

  temporal:
    image: temporalio/auto-setup:1.24.0
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - SQLITE_STORAGE_DIR=/etc/temporal/data
    volumes:
      - temporal-data:/etc/temporal/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=zonata_minio_admin
      - MINIO_ROOT_PASSWORD=zonata_minio_secret_password_2026
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    restart: unless-stopped
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=zonata_admin_password_2026
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  zonata-storage:
    name: zonata-storage
  postgres-data:
    name: postgres-data
  nats-data:
    name: nats-data
  temporal-data:
    name: temporal-data
  minio-data:
    name: minio-data
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data
