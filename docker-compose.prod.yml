version: '3.8'

services:
  nginx-ingress:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.ingress
    image: zonata/ingress:1.0.0-GA
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - zonata-edge
      - zonata-internal
    depends_on:
      zonata-api:
        condition: service_healthy

  zonata-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: zonata/api:1.0.0-GA
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - ENVIRONMENT=production
      - ZONATA_STRICT_AUTH=1
      - ZONATA_DISABLE_DEMO_SEED=1
      - ZONATA_CLEAN_STARTUP=1
      - DATABASE_URL=${DATABASE_URL:-postgresql://zonata_app:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-zonata_production}}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-10}
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-50}
      - DATABASE_IDLE_TIMEOUT_SEC=${DATABASE_IDLE_TIMEOUT_SEC:-300}
      - DATABASE_BUSY_TIMEOUT_MS=${DATABASE_BUSY_TIMEOUT_MS:-60000}
      - DB_PATH=/app/storage/roboassistant.db
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - VAULT_ADDR=http://vault:8200
      - KEYCLOAK_URL=http://keycloak:8080
      - S3_ENDPOINT=http://minio:9000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - zonata-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-edge
      - zonata-internal
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
      minio:
        condition: service_started

  zonata-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: zonata/worker:1.0.0-GA
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - ZONATA_STRICT_AUTH=1
      - ZONATA_DISABLE_DEMO_SEED=1
      - DATABASE_URL=${WORKER_DATABASE_URL:-postgresql://zonata_worker:${DB_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB:-zonata_production}}
      - DATABASE_MIN_POOL_SIZE=${DATABASE_MIN_POOL_SIZE:-5}
      - DATABASE_MAX_POOL_SIZE=${DATABASE_MAX_POOL_SIZE:-20}
      - DATABASE_IDLE_TIMEOUT_SEC=${DATABASE_IDLE_TIMEOUT_SEC:-300}
      - DATABASE_BUSY_TIMEOUT_MS=${DATABASE_BUSY_TIMEOUT_MS:-60000}
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - DB_PATH=/app/storage/roboassistant.db
    volumes:
      - zonata-storage:/app/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_started
      zonata-api:
        condition: service_healthy

  zonata-backup-replicator:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: zonata/backup-replicator:1.0.0-GA
    restart: unless-stopped
    command: ["python3", "scripts/offhost_backup_sync.py", "--continuous", "--interval", "60"]
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - S3_ENDPOINT=http://minio:9000
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-zonata-backups-production}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-zonata_minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - PG_WAL_ARCHIVE_DIR=/var/lib/postgresql/wal_archive
      - PG_BASE_BACKUP_DIR=/var/lib/postgresql/base_backups
    volumes:
      - postgres-wal-archive:/var/lib/postgresql/wal_archive:ro
      - postgres-base-backups:/var/lib/postgresql/base_backups:ro
      - zonata-storage:/app/storage:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-zonata_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-zonata_production}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=60
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/var/lib/postgresql/wal_archive
      - postgres-base-backups:/var/lib/postgresql/base_backups
      - ./docker/init-db-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonata_admin -d zonata_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data/jetstream", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/varz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  temporal:
    image: temporalio/auto-setup:1.24.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${TEMPORAL_DB_USER:-zonata_admin}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    volumes:
      - temporal-data:/etc/temporal/data
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-zonata_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8889:8889" # Prometheus metrics
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - zonata-internal

networks:
  zonata-edge:
    name: zonata-edge
    driver: bridge
  zonata-internal:
    name: zonata-internal
    driver: bridge

volumes:
  zonata-storage:
    name: zonata-storage
  postgres-data:
    name: postgres-data
  nats-data:
    name: nats-data
  temporal-data:
    name: temporal-data
  minio-data:
    name: minio-data
  prometheus-data:
    name: prometheus-data
  alertmanager-data:
    name: alertmanager-data
  grafana-data:
    name: grafana-data
  postgres-wal-archive:
    name: postgres-wal-archive
  postgres-base-backups:
    name: postgres-base-backups
